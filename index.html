<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Ku - Hasyim</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:15px;text-align:center}
header h1{margin:0;font-size:22px}
#userArea{margin-top:10px}
#userArea button{background:#fff;color:#111;border:0;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
#userArea img{width:32px;height:32px;border-radius:50%;vertical-align:middle}
#userArea span{margin:0 8px;font-weight:bold}
.produk{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.produk h3{margin:0 0 5px}
.harga{color:#e91e63;font-weight:bold;font-size:18px}
.beli{display:block;text-align:center;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>🛍️ TOKO KU</h1>
<div id="userArea">
<button id="btnLogin">Login dengan Google</button>
</div>
</header>
<div id="list">Memuat produk...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcRZL7cOp1Si5OahbMd0DFuxrQg7eFHuk",
  authDomain: "toko-ku-7d774.firebaseapp.com",
  projectId: "toko-ku-7d774",
  storageBucket: "toko-ku-7d774.firebasestorage.app",
  messagingSenderId: "789697068494",
  appId: "1:789697068494:web:eb620edd242374af4b7f9f",
  measurementId: "G-2NSPWZJGTM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const userArea = document.getElementById('userArea');

async function doLogin(){
  try { await signInWithPopup(auth, provider); }
  catch(e){ alert("Gagal login: " + e.message); }
}
document.getElementById('btnLogin').onclick = doLogin;

onAuthStateChanged(auth, (user) => {
  if(user){
    userArea.innerHTML = `<img src="${user.photoURL}"><span>Halo, ${user.displayName}!</span><button id="btnLogout">Logout</button>`;
    document.getElementById('btnLogout').onclick = () => signOut(auth);
  } else {
    userArea.innerHTML = `<button id="btnLogin2">Login dengan Google</button>`;
    document.getElementById('btnLogin2').onclick = doLogin;
  }
});

const list = document.getElementById('list');
try {
  const snap = await getDocs(collection(db, "products"));
  if(snap.empty){ list.innerHTML = "Belum ada produk"; }
  else {
    list.innerHTML = "";
    snap.forEach(doc => {
      const p = doc.data();
      list.innerHTML += `<div class="produk"><h3>${p.nama}</h3><p>${p.deskripsi||''}</p><div class="harga">Rp ${Number(p.harga).toLocaleString('id-ID')}</div><a class="beli" href="https://wa.me/6281234567890?text=Halo kak, saya mau beli ${encodeURIComponent(p.nama)} Rp ${p.harga}" target="_blank">BELI VIA WHATSAPP</a></div>`;
    });
  }
} catch(e){ list.innerHTML = "Gagal load: " + e.message; }
</script>
</body>
</html>
